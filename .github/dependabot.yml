version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      openai-instructor:
        patterns:
          - openai
          - instructor
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      vite:
        patterns:
          - vite
          - "@vitejs/plugin-react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
