name: Deploy AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require repo secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$ECR_REPOSITORY" ]]; then
            echo "Set repo secrets AWS_ROLE_ARN and ECR_REPOSITORY (optional APPRUNNER_SERVICE_ARN), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login
      - name: Build and push
        env:
          ECR: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE="${{ steps.login.outputs.registry }}/${ECR}:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "${{ steps.login.outputs.registry }}/${ECR}:latest" .
          docker push "$IMAGE"
          docker push "${{ steps.login.outputs.registry }}/${ECR}:latest"
      - name: Roll App Runner
        if: ${{ secrets.APPRUNNER_SERVICE_ARN != '' }}
        run: |
          aws apprunner start-deployment --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}"
